name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check

  # Firestore rules/indexes and Auth providers live in the repo and are deployed only from here, never edited in the console.
  deploy-firestore:
    # Skipped until the repo has the FIREBASE_PROJECT_ID variable and FIREBASE_SERVICE_ACCOUNT secret (see README).
    if: github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf "%s" "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx -y firebase-tools@15 deploy --only firestore,auth --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
